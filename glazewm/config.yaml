# GlazeWM: Windows port of hypr/hyprland.conf
#
# Mod key is RIGHT ALT ('ralt'), and the physical Win key is remapped to it
# (Scancode Map, or PowerToys Keyboard Manager), so the binds sit exactly
# where they do in Hyprland: physical Super+h = ralt+h.
# Why not bind Win directly: Windows opens Start every time Win is released
# after a GlazeWM bind, and Win+L (lock) can't be intercepted at all.
# Left Alt stays untouched for apps (alt+tab, alt+d in browsers, ...).
#
# Lives in ~/.config/glazewm/config.yaml (WSL); `glaze-sync` copies it to
# %USERPROFILE%\.glzr\glazewm\config.yaml, then Super+Shift+R reloads.

general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []

  # hypr: follow_mouse = 1
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  # hypr: gaps_in = 5 (per side) / gaps_out = 12
  inner_gap: '10px'
  outer_gap:
    top: '12px'
    right: '12px'
    bottom: '12px'
    left: '12px'

# Catppuccin Frappe, same as hypr / waybar / starship.
# Borders + corners are Windows 11 only.
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#ca9ee6' # mauve
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

  other_windows:
    border:
      enabled: true
      color: '#595959'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    # hypr: inactive_opacity = 0.95
    transparency:
      enabled: true
      opacity: '95%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'
  - name: '10'

window_rules:
  - commands: ['ignore']
    match:
      # Picture-in-picture
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }

      # PowerToys overlays
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }

      # Office popups/dialogs (main windows still tile)
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'ralt+r']

keybindings:
  # --- apps ---------------------------------------------------------------
  # hypr: SUPER+Return -> kitty. Set NixOS as Windows Terminal's default
  # profile so this drops you straight into fish.
  - commands: ['shell-exec wt']
    bindings: ['ralt+enter']

  # hypr: SUPER+D fuzzel -> Flow Launcher (Catppuccin Frappe theme).
  # Not bound here: Flow's own hotkey is set to Alt+D, which fires instantly
  # (relaunching Flow.Launcher.exe from here works but takes ~half a second).
  # GlazeWM leaves ralt+d alone so it reaches Flow.

  # hypr: SUPER+SHIFT+S screenshot -> PrtScn (Snipping Tool on Win 11).
  # Start menu, if ever needed -> ctrl+esc

  # --- windows ------------------------------------------------------------
  - commands: ['close']
    bindings: ['ralt+shift+q']
  - commands: ['toggle-fullscreen']
    bindings: ['ralt+f']
  # hypr: togglesplit
  - commands: ['toggle-tiling-direction']
    bindings: ['ralt+v']
  - commands: ['toggle-floating --centered']
    bindings: ['ralt+shift+space']
  - commands: ['wm-cycle-focus']
    bindings: ['ralt+space']
  - commands: ['toggle-minimized']
    bindings: ['ralt+m']

  # Focus: Super+hjkl
  # (arrows too, as a fallback if physical Super+L still locks the screen)
  - commands: ['focus --direction left']
    bindings: ['ralt+h', 'ralt+left']
  - commands: ['focus --direction down']
    bindings: ['ralt+j', 'ralt+down']
  - commands: ['focus --direction up']
    bindings: ['ralt+k', 'ralt+up']
  - commands: ['focus --direction right']
    bindings: ['ralt+l', 'ralt+right']

  # Move: Super+Shift+arrows, same as hypr.
  # (left Alt stays free, so tmux M-H / M-L are unaffected)
  - commands: ['move --direction left']
    bindings: ['ralt+shift+left']
  - commands: ['move --direction down']
    bindings: ['ralt+shift+down']
  - commands: ['move --direction up']
    bindings: ['ralt+shift+up']
  - commands: ['move --direction right']
    bindings: ['ralt+shift+right']

  # Resize: alt+r enters resize mode, then hjkl / arrows, esc to leave
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['ralt+r']

  # --- workspaces (hypr: SUPER+[0-9], SUPER+SHIFT+[0-9]) -------------------
  - commands: ['focus --workspace 1']
    bindings: ['ralt+1']
  - commands: ['focus --workspace 2']
    bindings: ['ralt+2']
  - commands: ['focus --workspace 3']
    bindings: ['ralt+3']
  - commands: ['focus --workspace 4']
    bindings: ['ralt+4']
  - commands: ['focus --workspace 5']
    bindings: ['ralt+5']
  - commands: ['focus --workspace 6']
    bindings: ['ralt+6']
  - commands: ['focus --workspace 7']
    bindings: ['ralt+7']
  - commands: ['focus --workspace 8']
    bindings: ['ralt+8']
  - commands: ['focus --workspace 9']
    bindings: ['ralt+9']
  - commands: ['focus --workspace 10']
    bindings: ['ralt+0']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['ralt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['ralt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['ralt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['ralt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['ralt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['ralt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['ralt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['ralt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['ralt+shift+9']
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['ralt+shift+0']

  # Monitors (office dock): send workspace to the other screen
  - commands: ['move-workspace --direction left']
    bindings: ['ralt+shift+a']
  - commands: ['move-workspace --direction right']
    bindings: ['ralt+shift+f']

  # Hyprland's SUPER+scroll -> cycle active workspaces
  # (alt+tab is left to Windows)
  - commands: ['focus --next-active-workspace']
    bindings: ['ralt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['ralt+a']

  # --- WM -----------------------------------------------------------------
  # Escape hatch: suspends all tiling + binds (e.g. for a screen share)
  - commands: ['wm-toggle-pause']
    bindings: ['ralt+shift+p']
  - commands: ['wm-reload-config']
    bindings: ['ralt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['ralt+shift+w']
  - commands: ['wm-exit']
    bindings: ['ralt+shift+e']
